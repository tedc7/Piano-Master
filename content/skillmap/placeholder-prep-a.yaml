# PLACEHOLDER skill map, for testing the app until the Faber books arrive (arch §6.2, §6.3).
# Replace it with the real Prep A map drafted from the books. Its ids start with
# "placeholder." so they can never collide with real skill ids (ids are never reused, §5).
#
# Shape: a small branching map (§6.3) with one fork and one join:
#
#   rh-c-position ──┬── rh-reach-a ──── three-four-time
#                   └── lh-c-position ─┐
#   rh-c-position ─────────────────────┴── hands-take-turns
#
# `pieces` says which skill each core piece was written for. Song analysis (§6.8,
# api/app/analysis.py) decides the required and featured skills from the constraints; the build
# warns when it disagrees.

map: basic
level: Prep A
placeholder: true
skills:
  - id: placeholder.rh-c-position
    name: Right hand in C position
    sequence: 10
    track: reading
    staff: treble
    prerequisites: []
    constraints:
      position: {R: C4}          # five-finger position: fingers for the finger-number generator
      hands: [R]
      range: {R: [C4, G4]}
      durations: [0.5, 1, 2, 4]
      timeSigs: ["4/4"]
      keySigs: [0]
    description: Five fingers on C D E F G with the right hand; quarter, half and whole notes, and eighth-note pairs.
    pieces: [hot-cross-buns, mary-had-a-little-lamb]

  - id: placeholder.lh-c-position
    name: Left hand in C position
    sequence: 20
    track: reading
    staff: bass
    prerequisites: [placeholder.rh-c-position]
    constraints:
      position: {L: C3}          # five-finger position: fingers for the finger-number generator
      hands: [L]
      range: {L: [C3, G3]}
      durations: [1, 2, 4]
      timeSigs: ["4/4"]
      keySigs: [0]
    description: The same five-finger position one octave lower, read on the bass staff.
    pieces: [bass-walk]

  - id: placeholder.rh-reach-a
    name: Right hand reaches up to A
    sequence: 30
    track: technique
    staff: treble
    prerequisites: [placeholder.rh-c-position]
    constraints:
      hands: [R]
      range: {R: [C4, A4]}
      durations: [1, 2]
      timeSigs: ["4/4"]
      keySigs: [0]
    description: Stretch the fifth finger from G up to A and come back into C position.
    pieces: [twinkle-twinkle]

  - id: placeholder.hands-take-turns
    name: Hands take turns
    sequence: 40
    track: reading
    staff: grand
    prerequisites: [placeholder.rh-c-position, placeholder.lh-c-position]
    constraints:
      position: {R: C4, L: C3}          # five-finger position: fingers for the finger-number generator
      hands: [R, L]
      range: {R: [C4, G4], L: [C3, G3]}
      durations: [1, 2, 4]
      timeSigs: ["4/4"]
      keySigs: [0]
    description: Short phrases passed between the hands on the grand staff; never both at once.
    pieces: [echo-song]

  - id: placeholder.three-four-time
    name: Three-four time (test song with vocals)
    sequence: 50
    track: rhythm
    staff: treble
    prerequisites: [placeholder.rh-reach-a]
    # A test skill: its constraints are widened to take in Amazing Grace (up to D5, dotted
    # quarters, G major), so the song with the YuE2 stems, vocals button and tempo versions stays
    # reachable for students on the placeholder map.
    constraints:
      hands: [R]
      range: {R: [C4, D5]}
      durations: [0.5, 1, 1.5, 2, 3]
      timeSigs: ["3/4"]
      keySigs: [0, 1]
    description: "Three beats in a bar. Test piece: the Amazing Grace melody with the YuE2 vocal and backing."
    pieces: [amazing-grace-melody]
