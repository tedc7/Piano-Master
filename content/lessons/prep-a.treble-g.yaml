# Concept lesson (arch §3 "Teaching concepts", §6.9) for prep-a.treble-g, in our own words: one concept, one Explain.
# Type: Notes. Notes: C4, F#3; ":2" makes a note 2 beats;
# [C4,E4] is two notes at once; `level` on a Hear card is how hard the app's piano plays it (0 to 1).
skill: prep-a.treble-g
title: Treble G
cards:
- kind: explain
  text: Treble G is the G just above Middle C, on the second line of the treble staff. The treble clef circles that
    line, so it's also called the G clef.
- kind: show
  text: Middle C with the right thumb, then Treble G with finger 5.
  notes: C4 G4
  fingers:
  - 1
  - 5
  hand: R
- kind: hear
  text: Middle C, then up to Treble G.
  play: C4:2 G4:2 C4:2 G4:2
  tempo: 90
- kind: try
  text: 'Right hand: thumb on Middle C, finger 5 on Treble G.'
  notes: C4 G4 C4 G4
  fingers:
  - 1
  - 5
  - 1
  - 5
  hand: R
- kind: echo
  text: 'Listen, then play it back: Middle C and Treble G.'
  play: C4 G4 G4 C4
  tempo: 80
- kind: check
  questions:
  - text: Play Treble G, the note on the treble clef's curly line.
    answer: G4
  - text: The treble clef is also called the...
    choices:
    - G clef
    - F clef
    answer: G clef
