# Concept lesson (arch §3 "Teaching concepts", §6.9) for the PLACEHOLDER skill map. Written in our
# own words from standard beginner teaching; replace with the Faber-order lessons.
#
# Notes: C4, F#3, Bb4; ":2" makes a note 2 beats; [C4,E4,G4] is a chord.
skill: placeholder.rh-c-position
title: Right hand in C position
cards:
  - kind: explain
    text: Put your right thumb on middle C. Your five fingers each get their own key, C D E F G, one finger per key. That's called C position.
  - kind: show
    text: Thumb on C, then fingers 2, 3, 4 and 5 on D, E, F and G.
    notes: C4 D4 E4 F4 G4
    fingers: [1, 2, 3, 4, 5]
    hand: R
    clef: treble
  - kind: hear
    text: Here are the five notes going up, one finger at a time.
    play: C4 D4 E4 F4 G4:2
    contrast:
      text: And here they are coming back down.
      play: G4 F4 E4 D4 C4:2
  - kind: try
    text: Play C D E F G with your right hand, fingers 1 to 5.
    notes: C4 D4 E4 F4 G4
    fingers: [1, 2, 3, 4, 5]
    hand: R
  - kind: echo
    text: Listen, then play it back. Start on C with your thumb.
    play: C4 D4 E4
  - kind: check
    questions:
      - text: Which key does your thumb play? Tap it or play it.
        answer: C4
      - text: Now find the key for finger 5.
        answer: G4
