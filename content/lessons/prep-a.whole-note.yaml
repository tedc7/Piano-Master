# Concept lesson (arch §3 "Teaching concepts", §6.9) for prep-a.whole-note, in our own words: one concept, one Explain.
# Type: Rhythm. Notes: C4, F#3; ":2" makes a note 2 beats;
# [C4,E4] is two notes at once; `level` on a Hear card is how hard the app's piano plays it (0 to 1).
skill: prep-a.whole-note
title: The whole note
cards:
- kind: explain
  text: 'A whole note is hollow with no stem. It gets four beats: play it and hold it while you count 1, 2, 3, 4.'
- kind: show
  text: A whole note fills a whole measure of four beats.
  notes: F#4:4
  fingers:
  - 2
  hand: R
- kind: hear
  text: 'Count along: quarter, quarter, half, then a whole note.'
  play: F#4 G#4 A#4:2 F#4:4
  tempo: 90
- kind: try
  text: Play the whole note and keep holding for four beats.
  notes: F#4:4
  fingers:
  - 2
  hand: R
- kind: echo
  text: Listen, then play it back and hold the last note for four.
  play: C#4 D#4 C#4:4
  tempo: 80
- kind: check
  questions:
  - text: How many beats does a whole note get?
    choices:
    - '2'
    - '3'
    - '4'
    answer: '4'
  - text: Which note has no stem?
    choices:
    - Quarter note
    - Half note
    - Whole note
    answer: Whole note
  - text: Listen. How many beats was the last note?
    hear: C#4 C#4 D#4:4
    choices:
    - '2'
    - '4'
    answer: '4'
