# Concept lesson for the PLACEHOLDER skill map (our own words; see placeholder.rh-c-position.yaml).
skill: placeholder.hands-take-turns
title: Hands take turns
cards:
  - kind: explain
    text: Now both hands play in one song, but never at the same time. First the right hand plays a little tune, then the left hand answers it. The music has two staffs, one for each hand.
  - kind: show
    text: The right hand plays on the top staff, then the left hand on the bottom staff.
    notes: E4 D4 C4 E3 D3 C3
    fingers: [3, 2, 1, 3, 4, 5]
    hand: RL
    clef: grand
  - kind: hear
    text: Listen to the right hand call and the left hand echo.
    play: E4 D4 C4:2 E3 D3 C3:2
  - kind: try
    text: Play E D C with your right hand, then E D C with your left hand.
    notes: E4 D4 C4 E3 D3 C3
    fingers: [3, 2, 1, 3, 4, 5]
    hand: RL
  - kind: check
    questions:
      - text: Which C does the left hand play in this song? Tap it or play it.
        answer: C3
