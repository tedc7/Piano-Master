# Concept lesson (arch §3 "Teaching concepts", §6.9) for prep-a.three-black-keys, in our own words: one concept, one Explain.
# Type: Notes. Notes: C4, F#3; ":2" makes a note 2 beats;
# [C4,E4] is two notes at once; `level` on a Hear card is how hard the app's piano plays it (0 to 1).
skill: prep-a.three-black-keys
title: Groups of three black keys
cards:
- kind: explain
  text: Next to each group of two black keys is a group of three. Play them with fingers 2, 3 and 4, one finger
    on each key.
- kind: show
  text: 'Right hand: fingers 2, 3 and 4 on the three black keys.'
  notes: F#4 G#4 A#4
  fingers:
  - 2
  - 3
  - 4
  hand: R
- kind: hear
  text: Up the three black keys and back down.
  play: F#4 G#4 A#4 G#4 F#4:2
  tempo: 96
- kind: try
  text: Play the three black keys going up with fingers 2, 3, 4.
  notes: F#4 G#4 A#4
  fingers:
  - 2
  - 3
  - 4
  hand: R
- kind: try
  text: 'Left hand: fingers 4, 3 and 2 on the three black keys below the middle.'
  notes: F#3 G#3 A#3
  fingers:
  - 4
  - 3
  - 2
  hand: L
  clef: bass
- kind: echo
  text: Listen, then play it back on the three black keys.
  play: F#4 G#4 A#4 A#4
  tempo: 80
- kind: check
  questions:
  - text: How many black keys are in the bigger group?
    choices:
    - '2'
    - '3'
    - '4'
    answer: '3'
  - text: Play the middle key of the three black keys, with finger 3.
    answer: G#4
  - text: Listen. Did the notes go up or down?
    hear: A#4 G#4 F#4
    choices:
    - Up
    - Down
    answer: Down
