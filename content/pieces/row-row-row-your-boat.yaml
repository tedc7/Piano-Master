# Library song. "Row, Row, Row Your Boat", traditional round (words 1852; tune usually credited to
# Eliphalet Oram Lyte, 1881); public domain. Retyped by us in C, 6/8, with chord symbols; checked
# against MakingMusicFun.net's beginner guitar sheet (sources/row-row-row-your-boat-guitar.pdf, in
# G major and 3/4: the same melody; free for instruction, not openly licensed, so checked only).
# Sung three times. It's a round, so the backing is the round itself: two more voices enter two and
# four bars behind (FluidSynth, `round` style), with a bass on the chords.
