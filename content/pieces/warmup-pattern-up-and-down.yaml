# Curriculum song (Prep A, prep-a.musical-alphabet). Warm-up in our own music and words: an eagle up, a gopher down (the parent's idea, Oct 4;
# the earlier letter-name words didn't line up with the sung letters). The letter names stay under the note heads.
# A pattern moved to the next C D E: up for the right hand, down for the left.
title: "Warm-up: Pattern Up, Pattern Down"
composer: Piano-Master
genre: studies
level: Prep A
hands: RL
source:
  site: Piano-Master
  url: https://github.com/tedc7/Piano-Master/blob/main/content/pieces/warmup-pattern-up-and-down.yaml
license:
  composition: original
  edition: original
letters: true             # pre-staff: letter names under the note heads (Units 1 to 3 read by letter names)
phraseBars: 2
media:
  vocal_octave: -1         # sung E3-E4: every take dropped an octave on the held E5s ("sky high", "deep hole")
abc: |
  X:1
  T:Warm-up: Pattern Up, Pattern Down
  M:4/4
  L:1/4
  Q:1/4=88
  %%score {RH LH}
  K:C
  V:RH clef=treble
  V:LH clef=bass
  [V:RH] !4!E !3!D !2!C D | E2 E2 | e d c d | e2 e2 | z4 | z4 | z4 | z4 |]
  w: Ea-gle spreads its wings wide, soar-ing to the sky high!
  [V:LH] z4 | z4 | z4 | z4 | !2!E, !3!D, !4!C, D, | E,2 E,2 | E,, D,, C,, D,, | E,,2 E,,2 |]
  w: Go-pher digs a deep hole, dig-ging down be-low ground!
