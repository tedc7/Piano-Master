# Library song. "Five Little Ducks", traditional American counting song. Its origin is unknown and
# no printing before 1930 was found, so its public-domain status rests on it being traditional
# (credited "traditional" by Raffi's 1982 recording and SecondHandSongs): FOR THE PARENT TO DECIDE.
# Retyped by us, moved from the source's G major down to C (C4-C5, no sharps), with chord symbols;
# checked against NancyMusic.com's lead sheet (sources/five-little-ducks-nancymusic.pdf, free song
# of the month, not openly licensed, so checked only).
# Changed: bar 6 ("quack, quack, quack") is B A G2 for the four quacks of the words; the lead sheet
# has an extra "quack" on a dotted rhythm. The lead sheet's optional Am chord is kept (as Dm in C).
# Verses: 5, 4, 3, 2, 1 ducks, then "Sad mother duck", as in the lead sheet; "duckies" where the
# line needs ten syllables.
# Media (M8): YuE2 vocal; FluidSynth backing from the chord symbols in the kids' style.
# Tempo: written in cut time (2/2), as it is sung: two beats a bar. Half = 80, 80% of the recordings' pace:
# the parent heard the words run together at 100 (review note, Sep 29, 2026).
