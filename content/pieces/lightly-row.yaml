  "C"!5!G !3!E E2 | "G7"!4!F !2!D D2 | "C"!1!C D E F | "C"G G G2 |
  w: Light-ly row, light-ly row, o'er the glass-y waves we go;
  "C"G E E2 | "G7"F D D2 | "C"C E G G | "C"C4 |
  w: Smooth-ly glide, smooth-ly glide, on the si-lent tide.
  "G7"D D D D | "G7"D E F2 | "C"E E E E | "C"E F G2 |
  w: Let the winds and wa-ters be min-gled with our mel-o-dy;
  "C"G E E2 | "G7"F D D2 | "C"C E G G | "C"C4 |]
  w: Sing and float, sing and float, in our lit-tle boat.
