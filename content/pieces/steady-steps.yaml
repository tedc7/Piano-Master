# Curriculum song (Prep A, prep-a.quarter-note). Original music and words for this app.
# The left hand's words changed at the parent's request (Oct 4): four "stomp"s in a row made the vocal stutter; now a big bear marches.
# v0.40: the left hand alone, at 84 (it took turns with the right hand before).
title: "Steady Steps"
composer: Piano-Master
genre: studies
level: Prep A
hands: L
source:
  site: Piano-Master
  url: https://github.com/tedc7/Piano-Master/blob/main/content/pieces/steady-steps.yaml
license:
  composition: original
  edition: original
letters: true             # pre-staff: letter names under the note heads (Units 1 to 3 read by letter names)
phraseBars: 2
abc: |
  X:1
  T:Steady Steps
  M:4/4
  L:1/4
  Q:1/4=84
  K:C clef=bass
  !3!^C, ^C, ^C, ^C, | !2!^D, ^D, ^D, ^D, |
  w: Walk, walk, walk, walk, step, step, step, step.
  !3!^C,, ^C,, ^C,, ^C,, | !2!^D,, ^D,, ^D,, ^D,, |]
  w: Big bear march-es, stomp-ing feet, boom!
