# Library test song: the melody of the Open Hymnal's Amazing Grace (words John Newton, 1779;
# tune New Britain; public domain), with the YuE2 vocal and backing from the feasibility tests.
# It has no ABC here: the sync probe (feasibility/sync-probe: convert.py ... build_site.py) made its
# notation and the stems aligned to it, and the approved copy in content/library/ is its source
# (`fromLibrary`, v0.51), so every install builds and starts with the same song.
title: Amazing Grace
composer: Traditional (New Britain)
genre: hymns
level: Level 2
hands: R
source:
  site: The Open Hymnal Project
  url: https://openhymnal.org/
license:
  composition: public-domain
  edition: public-domain (The Open Hymnal)
phraseBars: 4
verses: 2
fromLibrary: true
