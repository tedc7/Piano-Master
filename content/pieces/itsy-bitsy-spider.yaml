# Library song. "The Itsy Bitsy Spider", traditional (first printed in 1910, A. W. North, "Camp and
# Camino in Lower California"); public domain. Retyped by us in the source's key, G major (the
# melody uses no F sharp, so it stays in the G position with the low D pickup), 6/8, with chord
# symbols; checked note for note against MakingMusicFun.net's lead sheet
# (sources/itsy-bitsy-spider.pdf: free for instruction, not openly licensed, so checked only).
# Changed: the last note is 5 eighths instead of the lead sheet's 5 plus a rest, so the pickup and
# the last bar make one whole bar.
# Media (M8): YuE2 vocal; FluidSynth backing from the chord symbols in the kids' style.
