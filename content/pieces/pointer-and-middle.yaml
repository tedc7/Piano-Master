# Curriculum song (Prep A, prep-a.finger-numbers). Original music and words for this app. The words are a rabbit's day (at the parent's request: the earlier
# finger-number words were hard to sing and dull); the finger numbers stay on the staff. Pointer and middle held up together make the bunny's ears.
# v0.40: the right hand alone, at 76 (it took turns with the left hand before: too much for a first song).
title: "Pointer and Middle"
composer: Piano-Master
genre: studies
level: Prep A
hands: R
source:
  site: Piano-Master
  url: https://github.com/tedc7/Piano-Master/blob/main/content/pieces/pointer-and-middle.yaml
license:
  composition: original
  edition: original
letters: true             # pre-staff: letter names under the note heads (Units 1 to 3 read by letter names)
phraseBars: 2
abc: |
  X:1
  T:Pointer and Middle
  M:4/4
  L:1/4
  Q:1/4=76
  K:C
  !2!^C !3!^D ^C ^D | ^D ^D ^C ^C | ^C ^D ^C ^D | ^D ^D ^C ^C |
  w: Bun-ny, bun-ny, in the gar-den, nib-bling on a crunch-y car-rot,
  ^C ^D ^D ^C | ^C ^D ^C ^C | ^C ^D ^D ^C | ^C ^D ^C ^C |]
  w: two long ears go up to lis-ten, hop-ping home in time for din-ner!
