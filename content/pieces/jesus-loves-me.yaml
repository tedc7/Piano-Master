# Library song (a children's hymn). "Jesus Loves Me", words Anna Bartlett Warner (1860), music
# William Batchelder Bradbury (1862, "The Golden Shower"); public domain. Typed from the Cyber
# Hymnal's four-part setting in C (sources/jesus-loves-me-cyberhymnal.pdf, marked "Public Domain").
# The child plays the melody (`play: melody`); the alto, tenor and bass are kept for the backing,
# which plays them on strings and cello (the hymn style chosen for Amazing Grace, arch §10.5).
# Chord symbols added from the four parts, for YuE2 and the chord pad.
# Verses: the Cyber Hymnal's 1, 2 and 4; verse 3 ("Though I'm very weak and ill") is left out for
# young children. Tempo 112 (the source marks 115).
# Media (M8): YuE2 vocal; FluidSynth backing from the alto, tenor and bass.
