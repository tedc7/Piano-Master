# Library song. "London Bridge Is Falling Down", traditional English nursery rhyme (tune printed
# by the 1740s); public domain. Retyped by us: the melody in C for the right hand with chord
# symbols, checked note for note against MakingMusicFun.net's beginner piano arrangement
# (sources/london-bridge-piano-solo.pdf: free for instruction, not openly licensed, so checked only).
# Four traditional verses; the fourth ("stone so strong") ends the song on the bridge built again.
# Media (M8): YuE2 vocal; FluidSynth backing from the chord symbols in the kids' style.
# Tempo: written in cut time (2/2), as it is sung: two beats a bar.
