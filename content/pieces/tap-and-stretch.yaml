# Curriculum song (Prep A, prep-a.half-note). Original music and words for this app. The words are a rainy day (at the parent's request: the
# earlier "tap, tap, stretch" words, the same in both hands, were hard to sing apart); each half note is a word to stretch: pat, fall, splash, boom, roars, glows.
# v0.40: the left hand alone, at 84 (it took turns with the right hand before).
title: "Tap and Stretch"
composer: Piano-Master
genre: studies
level: Prep A
hands: L
source:
  site: Piano-Master
  url: https://github.com/tedc7/Piano-Master/blob/main/content/pieces/tap-and-stretch.yaml
license:
  composition: original
  edition: original
letters: true             # pre-staff: letter names under the note heads (Units 1 to 3 read by letter names)
phraseBars: 2
abc: |
  X:1
  T:Tap and Stretch
  M:4/4
  L:1/4
  Q:1/4=84
  K:C clef=bass
  !3!^C, !2!^D, ^C,2 | ^D, ^C, ^D,2 | ^C, ^C, ^D, ^D, | ^C, ^D, ^C,2 |
  w: Pit-ter pat, rain-drops fall, jump in-to the pud-dle, splash!
  !3!^C,, !2!^D,, ^C,,2 | ^D,, ^C,, ^D,,2 | ^C,, ^C,, ^D,, ^D,, | ^C,, ^D,, ^C,,2 |]
  w: Rum-ble, boom! Thun-der roars! Sun peeks out, a rain-bow glows!
