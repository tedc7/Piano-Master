  X:1
  T:Tap and Stretch
  M:4/4
  L:1/4
  Q:1/4=96
  %%score {RH LH}
  K:C
  V:RH clef=treble
  V:LH clef=bass
  [V:RH] !2!^C !3!^D ^C2 | ^D ^C ^D2 | ^C ^C ^D ^D | ^C ^D ^C2 | z4 | z4 | z4 | z4 |]
