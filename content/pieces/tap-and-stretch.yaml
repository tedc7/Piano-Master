  site: Piano-Master
  url: https://github.com/tedc7/Piano-Master/blob/main/content/pieces/tap-and-stretch.yaml
license:
  composition: original
  edition: original
letters: true             # pre-staff: letter names under the note heads (Units 1 to 3 read by letter names)
phraseBars: 2
