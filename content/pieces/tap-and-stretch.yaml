# Curriculum song (Prep A, prep-a.half-note). Original music and words for this app. The words are a rainy day (at the parent's request: the
# earlier "tap, tap, stretch" words, the same in both hands, were hard to sing apart); each half note is a word to stretch: pat, fall, splash, boom, roars, glows.
title: "Tap and Stretch"
composer: Piano-Master
genre: studies
level: Prep A
hands: RL
